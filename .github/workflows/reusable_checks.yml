name: "General checks: Lints, Tests, Docs"

on:
  workflow_call:

jobs:
  # check python formatting
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: astral-sh/ruff-action@v3
        name: Ruff

  # run unit tests
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --dev --verbose --all-extras
      - name: Run pytest
        run: uv run pytest

  # check python typing
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --dev --verbose --all-extras
      - name: Run basedpyright
        run: uv run basedpyright

  # build python wheel and docker image
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build --wheel
      - name: Build docker image
        run: docker build --platform=linux/amd64 -t borg2mqtt-ng:ci .